services:
  no:
    build: ./api
    image: analyser-api-no
    container_name: ${NOME_PROJETO:-analyser}-no
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PAPEL: no
      CENTRAL_URL: ${CENTRAL_URL:-}
      NO_TOKEN: ${NO_TOKEN:-}
      NO_HEARTBEAT_SEGUNDOS: ${NO_HEARTBEAT_SEGUNDOS:-60}
      NO_TIMEOUT_LEITURA_SEGUNDOS: ${NO_TIMEOUT_LEITURA_SEGUNDOS:-600}
      PASTA_INVESTIGACAO: /app/data
      API_WORKERS: ${API_WORKERS:-1}
      TUNEL_NO_ATIVO: ${TUNEL_NO_ATIVO:-1}
      JOBS_NO_LIMITE: ${JOBS_NO_LIMITE:-1}
      # CA emissora da rede PF (o central usa HTTPS com certificado emitido pela "PF SUBORDINATE
      # CA 01", que o Python do container não conhece) — gere o bundle em ./certs/pf-ca-chain.pem.
      # NO_CA_BUNDLE vazio = usa o feixe padrão do container (estações sem interceptação TLS).
      REQUESTS_CA_BUNDLE: ${NO_CA_BUNDLE:-/etc/pf-certs/pf-ca-chain.pem}
      SSL_CERT_FILE: ${NO_CA_BUNDLE:-/etc/pf-certs/pf-ca-chain.pem}
    volumes:
      - ./.env:/app/.env
      - ./certs/pf-ca-chain.pem:/etc/pf-certs/pf-ca-chain.pem:ro
      - ./VERSION:/app/VERSION:ro
      - ./.deploy:/app/.deploy:ro
      - ./.deploy/controle:/app/.deploy/controle:rw
      # os arquivos da delegacia: data/<DELEGACIA>/... — a ÚNICA cópia que existe dela
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - hf_cache:/app/.cache/huggingface
      - ./nginx/ssl:/app/certs:ro
    ports:
      - "${NO_PORT:-8090}:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/no/saude', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  no-web:
    image: nginx:1.27-alpine
    container_name: ${NOME_PROJETO:-analyser}-no-web
    restart: unless-stopped
    environment:
      NO_ALLOWED_ORIGIN: ${NO_MIDIA_ORIGIN:-https://policia-es.pf.gov.br}
    entrypoint: ["/bin/sh", "/templates/no-midia-entrypoint.sh"]
    volumes:
      - ./nginx/no-midia.conf.template:/templates/no-midia.conf.template:ro
      - ./nginx/no-midia-entrypoint.sh:/templates/no-midia-entrypoint.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${NO_MIDIA_PORT:-8443}:443"
    depends_on:
      - no

volumes:
  hf_cache:

